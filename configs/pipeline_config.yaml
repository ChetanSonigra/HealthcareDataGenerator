api_settings:
  chat_endpoint: "https://api.nvidia.com/v1/chat/completions"
  nvcf_safety_url: "https://api.nvidia.com/v1/safety/evaluate"
  customizer_url: "https://api.nvidia.com/v1/customization"

data_designer:
  target_language: "en"
  input_filetype: "jsonl"

synthesizer:
  model: "nemotron-4-340b-instruct"
  temperature: 0.7
  max_tokens: 1024

lora_finetuning:
  base_model: "llama-3-70b"
  epochs: 3
  learning_rate: 0.0002
  lora_r: 16
  lora_alpha: 32